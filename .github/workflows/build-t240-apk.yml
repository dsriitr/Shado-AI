name: Build T240 BLE test APK

on:
  push:
    paths:
      - 't240-ble-test/**'
      - '.github/workflows/build-t240-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: t240-ble-test
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: t240-ble-test-debug-apk
          path: t240-ble-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
