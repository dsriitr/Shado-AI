name: Build T240 BLE test APK

on:
  push:
    paths:
      - 't240-ble-test/**'
      - '.github/workflows/build-t240-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Only GitHub-authored actions/* are used here, so this works even when the
      # repository restricts third-party actions. The ubuntu-latest image already
      # ships the Android SDK, so no setup-android action is needed.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Show toolchain versions
        run: java -version 2>&1 && echo "runner=$RUNNER_OS $RUNNER_ARCH"

      - name: Build debug APK
        working-directory: t240-ble-test
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: t240-ble-test-debug-apk
          path: t240-ble-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
